<section class="wish-section">

  <div class="wish-card">

    <div class="wish-image">
      <img [src]="imgUrl" alt="Hero Image" class="img-fluid hero-img">
    </div>

    <div class="wish-content">

      <h1>Merry Christmas 🎄</h1>

      <h2>Harry Mike</h2>

      <p>
        May your Christmas sparkle with moments of love,
        laughter and goodwill. Wishing you peace, happiness,
        success and countless blessings throughout the year.
      </p>

      <button class="btn btn-danger">
        Send Wishes ❤️
      </button>

    </div>

  </div>

</section>
