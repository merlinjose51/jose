<section class="best-deals py-5">

  <div class="container">

    <div class="text-center mb-5">
      <h1 class="text-dark">🎁 Best Deals</h1>
      <p class="text-light">Special Christmas Gift Collection</p>
    </div>

    <div class="row g-4">

      <!-- Card 1 -->
      <div class="col-md-6 col-lg-3">
        <div class="card deal-card">
          <img [src]="gift1" class="card-img-top" alt="Gift">
          <div class="card-body text-center">
            <h5 class="card-title">Christmas Gift Box</h5>
            <p class="card-text">Beautiful premium Christmas gift box.</p>
            <h4 class="text-danger">₹999</h4>
            <button class="btn btn-danger w-100">Buy Now</button>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-md-6 col-lg-3">
        <div class="card deal-card">
          <img [src]="gift2" class="card-img-top" alt="Gift">
          <div class="card-body text-center">
            <h5 class="card-title">Santa Doll</h5>
            <p class="card-text">Soft Santa doll for Christmas decoration.</p>
            <h4 class="text-danger">₹799</h4>
            <button class="btn btn-danger w-100">Buy Now</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-md-6 col-lg-3">
        <div class="card deal-card">
          <img [src]="gift3" class="card-img-top" alt="Gift">
          <div class="card-body text-center">
            <h5 class="card-title">Christmas Tree</h5>
            <p class="card-text">Decorated artificial Christmas tree.</p>
            <h4 class="text-danger">₹1,499</h4>
            <button class="btn btn-danger w-100">Buy Now</button>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="col-md-6 col-lg-3">
        <div class="card deal-card">
          <img [src]="gift4" class="card-img-top" alt="Gift">
          <div class="card-body text-center">
            <h5 class="card-title">LED Lights</h5>
            <p class="card-text">Colorful LED lights for home decoration.</p>
            <h4 class="text-danger">₹599</h4>
            <button class="btn btn-danger w-100">Buy Now</button>
          </div>
        </div>
      </div>

    </div>

  </div>

</section>
